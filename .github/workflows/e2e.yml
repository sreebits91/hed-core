name: HED E2E

on:
  workflow_dispatch:
  push:
    branches: [feature/hed-v2-stability]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GO_VERSION: '1.26.6'
  GOFLAGS: '-mod=mod'

jobs:
  foundation:
    name: Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod download
      - run: go mod verify
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...

  stress:
    name: Stress
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod download
      - run: go test -count=20 ./...

  benchmark:
    name: Benchmark
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod download
      - name: Detect benchmarks
        id: detect
        shell: bash
        run: |
          if find . -name '*_test.go' -not -path './vendor/*' -print0 | xargs -0 grep -lq 'func Benchmark'; then
            echo 'has_benchmarks=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_benchmarks=false' >> "$GITHUB_OUTPUT"
            echo 'No Go benchmarks found; benchmark stage is not applicable yet.'
          fi
      - name: Run short benchmarks
        if: steps.detect.outputs.has_benchmarks == 'true'
        run: timeout 10m go test -run '^$' -bench='^Benchmark' -benchmem -benchtime=1s ./...

  profiling:
    name: Profiling
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod download
      - name: Detect benchmarks
        id: detect
        shell: bash
        run: |
          if find . -name '*_test.go' -not -path './vendor/*' -print0 | xargs -0 grep -lq 'func Benchmark'; then
            echo 'has_benchmarks=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_benchmarks=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Capture CPU and memory profiles
        if: steps.detect.outputs.has_benchmarks == 'true'
        run: |
          mkdir -p profiling
          timeout 10m go test -run '^$' -bench='^Benchmark' -benchtime=1s -cpuprofile=profiling/cpu.pprof -memprofile=profiling/mem.pprof ./...
          test -s profiling/cpu.pprof
          test -s profiling/mem.pprof
      - name: Upload profiles
        if: steps.detect.outputs.has_benchmarks == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hed-profiles
          path: profiling/
          if-no-files-found: error

  fabric:
    name: Fabric E2E readiness
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check for real Fabric harness
        shell: bash
        run: |
          set -e
          found=0
          for p in test-network fabric scripts/fabric; do
            if [ -d "$p" ]; then found=1; fi
          done
          if find . -name '*_test.go' -not -path './vendor/*' -print0 | xargs -0 grep -lq 'hyperledger/fabric'; then
            found=1
          fi
          if [ "$found" -eq 1 ]; then
            echo 'Real Fabric integration detected.'
          else
            echo 'Fabric harness is not present in this checkout.'
            echo 'This stage passes as readiness-only; it does not claim Fabric E2E coverage.'
          fi
