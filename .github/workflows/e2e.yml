name: HED End-to-End

on:
  workflow_dispatch:
  push:
    branches: [feature/hed-v2-stability]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GO_VERSION: '1.26.6'
  GOFLAGS: '-mod=mod'

jobs:
  reliability:
    name: Reliability and stress
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod download
      - run: go test ./...
      - name: Race suite
        run: go test -race ./...
      - name: Repeated stress
        run: go test -count=20 ./...

  benchmark:
    name: Throughput benchmark
    needs: reliability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod download
      - name: Run benchmarks
        run: go test -run '^$' -bench=. -benchmem -benchtime=10s ./...

  profiling:
    name: CPU and memory profiling
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod download
      - name: Capture profiles
        run: |
          mkdir -p profiling
          go test -run '^$' -bench=. -benchmem -cpuprofile=profiling/cpu.pprof -memprofile=profiling/mem.pprof ./...
      - uses: actions/upload-artifact@v4
        with:
          name: hed-profiles
          path: profiling/
          if-no-files-found: error

  fabric:
    name: Fabric E2E
    needs: profiling
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod download
      - name: Detect Fabric integration
        run: |
          if [ -d test-network ] || [ -d fabric ] || grep -Rqs "hyperledger/fabric" . --exclude-dir=.git; then
            echo "Fabric integration detected"
          else
            echo "No Fabric integration entrypoint exists in this checkout; refusing to fabricate a false E2E pass."
            exit 1
          fi
      - name: Run Fabric tests
        run: go test -count=1 ./...