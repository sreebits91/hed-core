name: HED Fabric E2E

on:
  workflow_dispatch:
  push:
    branches: [feature/hed-v2-stability]

permissions:
  contents: read

jobs:
  fabric-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Fabric binaries and images
        working-directory: fabric-samples
        run: ./install-fabric.sh docker binary

      - name: Start Fabric network and create channel
        working-directory: fabric-samples/test-network
        run: ./network.sh down && ./network.sh up createChannel -c mychannel -ca

      - name: Deploy HED chaincode
        working-directory: fabric-samples/test-network
        run: ./network.sh deployCC -ccn hed -ccp "$GITHUB_WORKSPACE/chaincode" -ccl go

      - name: Configure peer CLI
        run: |
          echo "CORE_PEER_TLS_ENABLED=true" >> "$GITHUB_ENV"
          echo "CORE_PEER_LOCALMSPID=Org1MSP" >> "$GITHUB_ENV"
          echo "CORE_PEER_TLS_ROOTCERT_FILE=$GITHUB_WORKSPACE/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt" >> "$GITHUB_ENV"
          echo "CORE_PEER_MSPCONFIGPATH=$GITHUB_WORKSPACE/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp" >> "$GITHUB_ENV"
          echo "ORDERER_CA=$GITHUB_WORKSPACE/fabric-samples/test-network/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/msp/tlscacerts/tlsca.example.com-cert.pem" >> "$GITHUB_ENV"
          echo "PATH=$GITHUB_WORKSPACE/fabric-samples/bin:$PATH" >> "$GITHUB_ENV"
          echo "FABRIC_CFG_PATH=$GITHUB_WORKSPACE/fabric-samples/config" >> "$GITHUB_ENV"

      - name: Commit and query through Fabric
        shell: bash
        run: |
          set -euo pipefail
          peer chaincode invoke -o localhost:7050 --ordererTLSHostnameOverride orderer.example.com --tls --cafile "$ORDERER_CA" -C mychannel -n hed --peerAddresses localhost:7051 --tlsRootCertFiles "$CORE_PEER_TLS_ROOTCERT_FILE" -c '{"function":"Commit","Args":["e2e-001","hed-fabric-e2e"]}'
          for i in {1..20}; do
            if peer chaincode query -C mychannel -n hed -c '{"function":"GetByHEDID","Args":["e2e-001"]}' | grep -q 'hed-fabric-e2e'; then
              exit 0
            fi
            sleep 2
          done
          echo 'Committed value was not queryable after 40 seconds' >&2
          exit 1

      - name: Peer restart recovery
        shell: bash
        run: |
          set -euo pipefail
          docker restart peer0.org1.example.com
          sleep 10
          peer chaincode query -C mychannel -n hed -c '{"function":"GetByHEDID","Args":["e2e-001"]}' | grep -q 'hed-fabric-e2e'

      - name: Orderer restart recovery
        shell: bash
        run: |
          set -euo pipefail
          docker stop orderer.example.com
          sleep 5
          docker start orderer.example.com
          sleep 15
          peer chaincode invoke -o localhost:7050 --ordererTLSHostnameOverride orderer.example.com --tls --cafile "$ORDERER_CA" -C mychannel -n hed --peerAddresses localhost:7051 --tlsRootCertFiles "$CORE_PEER_TLS_ROOTCERT_FILE" -c '{"function":"Commit","Args":["e2e-002","hed-orderer-recovery"]}'
          for i in {1..20}; do
            if peer chaincode query -C mychannel -n hed -c '{"function":"GetByHEDID","Args":["e2e-002"]}' | grep -q 'hed-orderer-recovery'; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Collect Fabric diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt
          docker logs orderer.example.com > artifacts/orderer.log 2>&1 || true
          docker logs peer0.org1.example.com > artifacts/peer.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-e2e-diagnostics
          path: artifacts/

      - name: Tear down Fabric
        if: always()
        working-directory: fabric-samples/test-network
        run: ./network.sh down
