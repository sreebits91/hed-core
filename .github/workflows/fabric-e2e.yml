name: HED Fabric E2E

on:
  workflow_dispatch:
  push:
    branches: [feature/hed-v2-stability]

permissions:
  contents: read

env:
  FABRIC_VERSION: '3.1.5'
  FABRIC_CA_VERSION: '1.5.17'

jobs:
  fabric-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout HED Core
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true

      - name: Verify Docker
        run: |
          docker version
          docker info

      - name: Install Fabric from official installer
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -rf fabric-samples install-fabric.sh
          curl -fsSL --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/hyperledger/fabric/main/scripts/install-fabric.sh \
            -o install-fabric.sh
          chmod +x install-fabric.sh
          ./install-fabric.sh --fabric-version "${FABRIC_VERSION}" \
            --ca-version "${FABRIC_CA_VERSION}" samples binary docker
          test -x fabric-samples/test-network/network.sh
          test -x fabric-samples/bin/peer
          test -x fabric-samples/bin/orderer
          test -f fabric-samples/config/core.yaml
          test -f fabric-samples/config/orderer.yaml
          fabric-samples/bin/peer version
          fabric-samples/bin/orderer version

      - name: Verify Fabric test network
        working-directory: fabric-samples/test-network
        run: |
          set -euo pipefail
          test -x ./network.sh
          test -f ./compose/compose-test-net.yaml

      - name: Prepare HED chaincode dependencies
        working-directory: chaincode
        env:
          GOFLAGS: '-mod=mod'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if go mod tidy && go mod verify; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'go module preparation failed after 3 attempts' >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          test -s go.sum

      - name: Start Fabric test network
        working-directory: fabric-samples/test-network
        run: |
          set -euo pipefail
          ./network.sh down || true
          ./network.sh up createChannel -ca -c mychannel
          docker ps --format '{{.Names}}' | grep -E 'peer0\.org1\.example\.com|orderer\.example\.com'

      - name: Deploy HED chaincode
        working-directory: fabric-samples/test-network
        run: |
          set -euo pipefail
          ./network.sh deployCC -ccn hed -ccp "${{ github.workspace }}/chaincode" -ccl go

      - name: Verify HED chaincode is committed
        working-directory: fabric-samples/test-network
        run: |
          set -euo pipefail
          source ./scripts/envVar.sh
          setGlobals 1
          peer lifecycle chaincode querycommitted -C mychannel -n hed

      - name: Live Fabric Gateway and ledger reconciliation
        working-directory: integration/fabric-gateway
        env:
          HED_FABRIC_E2E: '1'
          FABRIC_MSP_ID: Org1MSP
          FABRIC_CERT_PATH: ${{ github.workspace }}/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/signcerts
          FABRIC_KEY_PATH: ${{ github.workspace }}/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/keystore
          FABRIC_TLS_CERT_PATH: ${{ github.workspace }}/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt
          FABRIC_PEER_ENDPOINT: localhost:7051
          FABRIC_GATEWAY_PEER: peer0.org1.example.com
          FABRIC_CHANNEL: mychannel
          FABRIC_CHAINCODE: hed
          FABRIC_FUNCTION: Commit
        run: go test -run '^TestLiveFabric' -v ./...

      - name: Inject peer failure
        working-directory: integration/fabric-gateway
        env:
          HED_FABRIC_E2E: '1'
          HED_FABRIC_FAILURE: peer
          FABRIC_MSP_ID: Org1MSP
          FABRIC_CERT_PATH: ${{ github.workspace }}/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/signcerts
          FABRIC_KEY_PATH: ${{ github.workspace }}/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/keystore
          FABRIC_TLS_CERT_PATH: ${{ github.workspace }}/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt
          FABRIC_PEER_ENDPOINT: localhost:7051
          FABRIC_GATEWAY_PEER: peer0.org1.example.com
          FABRIC_CHANNEL: mychannel
          FABRIC_CHAINCODE: hed
          FABRIC_FUNCTION: Commit
        run: |
          set -euo pipefail
          docker stop peer0.org1.example.com
          trap 'docker start peer0.org1.example.com >/dev/null 2>&1 || true' EXIT
          go test -run '^TestLiveFabricFailure$' -v ./...

      - name: Inject orderer failure
        working-directory: integration/fabric-gateway
        env:
          HED_FABRIC_E2E: '1'
          HED_FABRIC_FAILURE: orderer
          FABRIC_MSP_ID: Org1MSP
          FABRIC_CERT_PATH: ${{ github.workspace }}/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/signcerts
          FABRIC_KEY_PATH: ${{ github.workspace }}/fabric-samples/test-network/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/msp/keystore
          FABRIC_TLS_CERT_PATH: ${{ github.workspace }}/fabric-samples/test-network/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/ca.crt
          FABRIC_PEER_ENDPOINT: localhost:7051
          FABRIC_GATEWAY_PEER: peer0.org1.example.com
          FABRIC_CHANNEL: mychannel
          FABRIC_CHAINCODE: hed
          FABRIC_FUNCTION: Commit
        run: |
          set -euo pipefail
          docker stop orderer.example.com
          trap 'docker start orderer.example.com >/dev/null 2>&1 || true' EXIT
          go test -run '^TestLiveFabricFailure$' -v ./...

      - name: Tear down Fabric
        if: always()
        working-directory: fabric-samples/test-network
        run: ./network.sh down || true
