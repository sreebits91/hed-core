name: HED Profiling

on:
  workflow_dispatch:
    inputs:
      profile_level:
        description: "Load level used for profiling"
        required: true
        default: "5M"
        type: choice
        options:
          - "100K"
          - "500K"
          - "1M"
          - "2M"
          - "5M"

permissions:
  contents: read

jobs:
  profiling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout selected benchmark ref
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go version
        run: go version

      - name: Go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Validate requested benchmark exists
        env:
          PROFILE_LEVEL: ${{ inputs.profile_level }}
        run: |
          set -euo pipefail
          BENCH="BenchmarkHLFLoad${PROFILE_LEVEL}"
          echo "Requested benchmark: ${BENCH}"
          go test -list '^BenchmarkHLFLoad' ./pkg/hlf | tee profiling-benchmarks.txt
          grep -Fx "${BENCH}" profiling-benchmarks.txt

      - name: CPU, heap, allocation, mutex and block profiles
        env:
          PROFILE_LEVEL: ${{ inputs.profile_level }}
        run: |
          set -euo pipefail
          mkdir -p profiling
          BENCH="BenchmarkHLFLoad${PROFILE_LEVEL}"
          echo "Running ${BENCH} for 30 seconds"
          go test -run '^$' -bench "^${BENCH}$" -benchtime=30s -count=1 -benchmem \
            -cpuprofile=profiling/cpu.pprof \
            -memprofile=profiling/heap.pprof \
            -mutexprofile=profiling/mutex.pprof \
            -blockprofile=profiling/block.pprof \
            ./pkg/hlf | tee profiling/benchmark.txt

          grep -Eq "${BENCH}[[:space:]]+[0-9]+" profiling/benchmark.txt

          test -s profiling/cpu.pprof
          test -s profiling/heap.pprof
          test -s profiling/mutex.pprof
          test -s profiling/block.pprof

      - name: Generate profile summaries
        run: |
          set -euo pipefail
          go tool pprof -top profiling/cpu.pprof | tee profiling/cpu-top.txt
          go tool pprof -top profiling/heap.pprof | tee profiling/heap-top.txt
          go tool pprof -top -alloc_objects profiling/heap.pprof | tee profiling/alloc-top.txt
          go tool pprof -top profiling/mutex.pprof | tee profiling/mutex-top.txt
          go tool pprof -top profiling/block.pprof | tee profiling/block-top.txt

      - name: Upload profiling artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hed-profiles-${{ inputs.profile_level }}
          path: |
            profiling/
            profiling-benchmarks.txt
          if-no-files-found: error
