name: HED Profiling

on:
  push:
    branches:
      - perf/100k-tps
  workflow_dispatch:
    inputs:
      profile_level:
        description: "Load level used for profiling"
        required: true
        default: "5M"
        type: choice
        options:
          - "100K"
          - "500K"
          - "1M"
          - "2M"
          - "5M"

permissions:
  contents: read

env:
  PROFILE_LEVEL: ${{ inputs.profile_level || '5M' }}

jobs:
  profiling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout selected benchmark ref
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go version
        run: go version

      - name: Go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Race tests
        run: go test -race ./...

      - name: Validate requested benchmark exists
        run: |
          set -euo pipefail
          BENCH="BenchmarkHLFLoad${PROFILE_LEVEL}"
          echo "Requested benchmark: ${BENCH}"
          go test -list '^BenchmarkHLFLoad' ./pkg/hlf | tee profiling-benchmarks.txt
          grep -Fx "${BENCH}" profiling-benchmarks.txt

      - name: CPU, heap, allocation, mutex and block profiles
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/profiling"
          PROFILE_DIR="$GITHUB_WORKSPACE/profiling"
          BENCH="BenchmarkHLFLoad${PROFILE_LEVEL}"
          echo "Running ${BENCH} for 30 seconds"

          go test -run '^$' -bench "^${BENCH}$" -benchtime=30s -count=1 -benchmem \
            -cpuprofile="${PROFILE_DIR}/cpu.pprof" \
            -memprofile="${PROFILE_DIR}/heap.pprof" \
            -mutexprofile="${PROFILE_DIR}/mutex.pprof" \
            -blockprofile="${PROFILE_DIR}/block.pprof" \
            ./pkg/hlf | tee "${PROFILE_DIR}/benchmark.txt"

          echo "=== profiling directory ==="
          find "$PROFILE_DIR" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

          # Go benchmark output normally includes a CPU suffix (for example
          # BenchmarkHLFLoad5M-4). Accept both suffixed and unsuffixed forms.
          grep -Eq "${BENCH}(-[0-9]+)?[[:space:]]+[0-9]+" "${PROFILE_DIR}/benchmark.txt"
          test -s "${PROFILE_DIR}/cpu.pprof"
          test -s "${PROFILE_DIR}/heap.pprof"
          test -s "${PROFILE_DIR}/mutex.pprof"
          test -s "${PROFILE_DIR}/block.pprof"

      - name: Generate profile summaries
        if: success()
        run: |
          set -euo pipefail
          go tool pprof -top "$GITHUB_WORKSPACE/profiling/cpu.pprof" | tee "$GITHUB_WORKSPACE/profiling/cpu-top.txt"
          go tool pprof -top "$GITHUB_WORKSPACE/profiling/heap.pprof" | tee "$GITHUB_WORKSPACE/profiling/heap-top.txt"
          go tool pprof -top -alloc_objects "$GITHUB_WORKSPACE/profiling/heap.pprof" | tee "$GITHUB_WORKSPACE/profiling/alloc-top.txt"
          go tool pprof -top "$GITHUB_WORKSPACE/profiling/mutex.pprof" | tee "$GITHUB_WORKSPACE/profiling/mutex-top.txt"
          go tool pprof -top "$GITHUB_WORKSPACE/profiling/block.pprof" | tee "$GITHUB_WORKSPACE/profiling/block-top.txt"

      - name: Upload profiling artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hed-profiles-${{ env.PROFILE_LEVEL }}
          path: |
            ${{ github.workspace }}/profiling/
            ${{ github.workspace }}/profiling-benchmarks.txt
          if-no-files-found: warn
