name: HED Performance

on:
  workflow_dispatch:
  push:
    branches: [feature/hed-v2-stability]

permissions:
  contents: read

env:
  GO_VERSION: '1.26.6'
  GOTOOLCHAIN: local
  GOFLAGS: '-mod=mod'

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: ${{ env.GO_VERSION }}, cache: true}
      - run: go mod download
      - run: go test -count=20 ./...

  benchmark:
    needs: stress
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: ${{ env.GO_VERSION }}, cache: true}
      - run: go mod download
      - name: Benchmark available code
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if grep -Rqs --include='*_test.go' --exclude-dir=vendor 'func Benchmark' .; then
            go test -run '^$' -bench='^Benchmark' -benchmem -benchtime=2s ./... | tee artifacts/benchmark.txt
          else
            printf '%s\n' 'No Benchmark functions found; benchmark harness must be added before TPS qualification.' | tee artifacts/benchmark.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hed-benchmark
          path: artifacts/benchmark.txt

  profiling:
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: ${{ env.GO_VERSION }}, cache: true}
      - run: go mod download
      - name: Profile when benchmarks exist
        run: |
          set -euo pipefail
          if grep -Rqs --include='*_test.go' --exclude-dir=vendor 'func Benchmark' .; then
            mkdir -p profiling
            go test -run '^$' -bench='^Benchmark' -benchtime=2s -cpuprofile=profiling/cpu.pprof -memprofile=profiling/mem.pprof ./...
            test -s profiling/cpu.pprof
            test -s profiling/mem.pprof
          else
            echo 'No benchmarks: profiling deferred.'
          fi
      - uses: actions/upload-artifact@v4
        if: hashFiles('profiling/*.pprof') != ''
        with:
          name: hed-profiles
          path: profiling/*.pprof

  fabric:
    needs: stress
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate real Fabric harness
        run: |
          set -euo pipefail
          if [ -f test-network/network.sh ]; then
            echo 'Fabric test-network detected.'
            echo 'Dedicated Fabric execution is gated on an explicit harness command.'
          elif [ -d test-network ] || [ -d fabric ]; then
            echo 'Fabric integration directory detected.'
          else
            echo 'Fabric E2E remains pending: no real Fabric harness is present.'
          fi
