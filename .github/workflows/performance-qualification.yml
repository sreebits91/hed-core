name: HED Performance Qualification

on:
  workflow_dispatch:
  push:
    branches: [feature/hed-v2-stability]

permissions:
  contents: read

env:
  GO_VERSION: '1.26.6'
  GOTOOLCHAIN: local
  GOFLAGS: '-mod=mod'

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod download
      - name: Build load test
        run: go build -o /tmp/hed-loadtest ./cmd/loadtest
      - name: Measure throughput tiers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for tx in 100000 250000 500000 1000000 5000000; do
            echo "===== ${tx} transactions =====" | tee -a artifacts/qualification.txt
            timeout 15m /tmp/hed-loadtest -tx "$tx" -workers 256 | tee -a artifacts/qualification.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hed-performance-qualification
          path: artifacts/qualification.txt

  profiles:
    needs: qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod download
      - name: Capture all Go runtime profiles
        env:
          HED_GOROUTINE_PROFILE: ${{ github.workspace }}/profiling/goroutine.pprof
        run: |
          set -euo pipefail
          mkdir -p profiling
          go test ./pkg/benchmark -run '^TestProfilingCapture$' -mutexprofile=profiling/mutex.pprof -blockprofile=profiling/block.pprof
          test -s profiling/mutex.pprof
          test -s profiling/block.pprof
          test -s profiling/goroutine.pprof
          go test ./pkg/benchmark -run '^$' -bench='^BenchmarkRun256Workers$' -benchtime=3s -cpuprofile=profiling/cpu.pprof -memprofile=profiling/memory.pprof
          test -s profiling/cpu.pprof
          test -s profiling/memory.pprof
      - uses: actions/upload-artifact@v4
        with:
          name: hed-all-profiles
          path: profiling/*.pprof
          if-no-files-found: error
