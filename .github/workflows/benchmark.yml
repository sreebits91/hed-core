name: HED TPS Benchmark

on:
  workflow_dispatch:
    inputs:
      start_tps:
        description: Initial offered TPS (0 = auto)
        required: true
        default: "0"
      max_tps:
        description: Maximum offered TPS (0 = auto)
        required: true
        default: "0"
      growth:
        description: Multiplicative rate increase per stage
        required: true
        default: "1.5"
      stages:
        description: Maximum ramp stages
        required: true
        default: "8"
      stage_duration:
        description: Duration per stage
        required: true
        default: "3s"
      workers:
        description: Producer goroutines
        required: true
        default: "64"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Run adaptive throughput benchmark
        run: |
          go run ./cmd/benchmark \
            -start-tps "${{ inputs.start_tps }}" \
            -max-tps "${{ inputs.max_tps }}" \
            -growth "${{ inputs.growth }}" \
            -stages "${{ inputs.stages }}" \
            -stage-duration "${{ inputs.stage_duration }}" \
            -workers "${{ inputs.workers }}" \
            -json benchmark-result.json
      - name: Publish benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: hed-adaptive-tps-benchmark
          path: benchmark-result.json
