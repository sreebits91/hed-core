name: HED Performance Ladder

on:
  push:
    branches: ['fix/**']
  workflow_dispatch:
    inputs:
      transactions:
        description: Logical transactions per run
        required: true
        default: "100000"
      workers:
        description: Worker count
        required: true
        default: "256"

permissions:
  contents: read

env:
  BENCH_TX: "100000"
  BENCH_WORKERS: "256"

jobs:
  core:
    name: In-memory Delta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Benchmark 100K
        run: go test ./pkg/benchmark -run '^$' -bench BenchmarkDeltaEngine100K -benchtime=1x -count=1 -timeout=5m
      - name: Exact 100K correctness
        run: go test ./pkg/benchmark -run TestRun256WorkerBenchmarkReachesExactTarget -count=1 -timeout=5m

  keydb:
    name: KeyDB persistence
    runs-on: ubuntu-latest
    services:
      keydb:
        image: eqalpha/keydb:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "keydb-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run KeyDB persistence benchmark
        run: go test ./pkg/benchmark -run 'TestKeyDB|TestRunStorageBenchmark' -bench BenchmarkKeyDB100K -benchtime=1x -count=1 -timeout=10m -v
        env:
          HED_KEYDB_ADDR: localhost:6379

  yugabyte:
    name: Yugabyte persistence
    runs-on: ubuntu-latest
    services:
      yugabyte:
        image: yugabytedb/yugabyte:2.25.2.0-b381
        ports:
          - 5433:5433
        options: >-
          --entrypoint /home/yugabyte/bin/yugabyted
          --health-cmd "bash -c 'echo > /dev/tcp/127.0.0.1/5433'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start Yugabyte single-node cluster
        run: |
          docker exec "$(docker ps -q --filter ancestor=yugabytedb/yugabyte:2.25.2.0-b381 | head -1)" \
            bin/yugabyted start --daemon=false --background=false --ui=false --callhome=false --advertise_address=127.0.0.1 &
          for i in {1..60}; do
            if docker exec "$(docker ps -q --filter ancestor=yugabytedb/yugabyte:2.25.2.0-b381 | head -1)" \
              bash -lc 'echo > /dev/tcp/127.0.0.1/5433' 2>/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Run Yugabyte persistence benchmark
        run: go test ./pkg/benchmark -run 'TestYugabyte|TestRunStorageBenchmark' -bench BenchmarkYugabyte100K -benchtime=1x -count=1 -timeout=15m -v
        env:
          HED_YUGABYTE_URL: postgres://yugabyte:yugabyte@localhost:5433/yugabyte?sslmode=disable

  summary:
    name: Performance interpretation
    needs: [core, keydb, yugabyte]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Explain the ladder
        run: |
          echo "HED performance ladder:"
          echo "1) In-memory Delta = algorithmic ceiling"
          echo "2) KeyDB = networked key/value persistence"
          echo "3) Yugabyte = distributed SQL persistence"
          echo "4) Fabric = ordering/endorsement/commit path"
          echo "5) Full E2E = production-facing measurement"
          echo "A passing core benchmark must never be reported as E2E TPS."
          echo "100K TPS remains the production target."
