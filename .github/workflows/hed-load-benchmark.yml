name: HED Load Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFLAGS: -mod=mod

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go version
        run: go version

      - name: Go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Race tests
        run: go test -race ./pkg/hlf ./pkg/engine

      - name: 100K / 250K / 500K load tests
        run: go test -run '^TestHLFLoadLevels$' -v ./pkg/hlf

      - name: Throughput benchmarks
        run: |
          set -euo pipefail
          go test -run '^$' -bench '^BenchmarkHLFLoad(100K|250K|500K)$' -benchtime=1x -count=1 -timeout=15m ./pkg/hlf | tee hed-load-benchmark.txt
          grep -Eq 'BenchmarkHLFLoad(100K|250K|500K)[[:space:]]+[0-9]+' hed-load-benchmark.txt

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hed-load-benchmark
          path: hed-load-benchmark.txt
          if-no-files-found: error
