name: HED Load Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go version
        run: go version

      - name: Go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Race tests
        run: go test -race ./pkg/hlf ./pkg/engine

      - name: 100K / 250K / 500K / 750K / 1M / 2M / 5M load tests
        run: go test -run '^TestHLFLoadLevels$' -v -timeout=20m ./pkg/hlf

      - name: 100K / 250K / 500K / 750K / 1M / 2M / 5M throughput benchmarks
        run: go test -run '^$' -bench '^BenchmarkHLFLoad(100K|250K|500K|750K|1M|2M|5M)$' -benchtime=1x -count=1 -timeout=20m ./pkg/hlf | tee hed-load-benchmark.txt

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hed-load-benchmark
          path: hed-load-benchmark.txt
          if-no-files-found: warn
