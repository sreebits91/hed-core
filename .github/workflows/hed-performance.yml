name: HED Performance

on:
  workflow_dispatch:
  push:
    branches: ["perf/100k-tps"]

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Race tests
        run: go test -race ./pkg/hlf ./pkg/engine

      - name: 100K / 250K / 500K load tests
        run: go test -run '^TestHLFLoadLevels$' -v ./pkg/hlf

      - name: Throughput benchmarks
        run: go test -run '^$' -bench '^BenchmarkHLFLoad(100K|250K|500K)$' -benchtime=1x -count=1 -timeout=10m ./pkg/hlf | tee hed-load-benchmark.txt

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: hed-load-benchmark
          path: hed-load-benchmark.txt
