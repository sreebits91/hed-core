name: Go CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t go_files < <(git ls-files '*.go' | grep -v '^pkg/dashboard/fabric-samples/' || true)
          if ((${#go_files[@]} > 0)); then
            unformatted="$(gofmt -l "${go_files[@]}")"
            if [[ -n "$unformatted" ]]; then
              echo "The following HED-owned Go files are not gofmt-clean:"
              printf '%s\n' "$unformatted"
              exit 1
            fi
          fi
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
