name: Go CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Format HED-owned Go sources
        if: github.event_name == 'push' && startsWith(github.ref_name, 'fix/')
        run: |
          set -euo pipefail
          mapfile -t go_files < <(git ls-files '*.go' | grep -vE '^(vendor/|pkg/dashboard/fabric-samples/)' || true)
          if ((${#go_files[@]} > 0)); then
            gofmt -w "${go_files[@]}"
          fi
          if ! git diff --quiet -- '*.go'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.go'
            git commit -m "ci: gofmt HED sources"
            git push
          fi
      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t go_files < <(git ls-files '*.go' | grep -vE '^(vendor/|pkg/dashboard/fabric-samples/)' || true)
          if ((${#go_files[@]} > 0)); then
            unformatted="$(gofmt -l "${go_files[@]}")"
            if [[ -n "$unformatted" ]]; then
              echo "The following HED-owned Go files are not gofmt-clean:"
              printf '%s\n' "$unformatted"
              exit 1
            fi
          fi
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
