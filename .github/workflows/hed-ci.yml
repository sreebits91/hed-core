name: HED Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_performance:
        description: "Run performance qualification"
        required: false
        default: false
        type: boolean
      run_fabric_e2e:
        description: "Run live Fabric E2E"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  GOFLAGS: "-mod=mod"

jobs:
  quality:
    name: Go quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        run: |
          files="$(gofmt -l . | grep -v '^vendor/' || true)"
          if [ -n "$files" ]; then
            echo "::warning::Existing Go formatting differences (non-blocking):"
            echo "$files"
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.26.x"
          go-package: ./...

  performance:
    name: Performance qualification
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_performance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 100K / 250K / 500K qualification
        run: HED_PERF_LEVELS=0 go test -v ./pkg/hlf -run TestHLFLoadLevels -count=1 -timeout=2m
      - name: Extended performance ladder
        run: HED_PERF_LEVELS=1 go test -v ./pkg/hlf -run TestHLFLoadLevels -count=1 -timeout=5m

  profiling:
    name: CPU allocation mutex block profiling
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_performance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: CPU profile
        run: go test ./pkg/v2 -run '^$' -bench BenchmarkPipelineIngress -benchtime=5s -cpuprofile cpu.out -memprofile alloc.out -mutexprofile mutex.out -blockprofile block.out
      - name: Upload profiles
        uses: actions/upload-artifact@v4
        with:
          name: hed-profiles
          path: |
            cpu.out
            alloc.out
            mutex.out
            block.out

  fabric-e2e:
    name: Fabric E2E
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_fabric_e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start local Fabric test network
        working-directory: /tmp
        run: |
          git clone --depth 1 --branch release-2.2 https://github.com/hyperledger/fabric-samples.git

          # release-2.2 network.sh expects the legacy docker-compose command and
          # Fabric CLI binaries in fabric-samples/bin.
          printf '#!/usr/bin/env bash\nexec docker compose "$@"\n' | sudo tee /usr/local/bin/docker-compose >/dev/null
          sudo chmod +x /usr/local/bin/docker-compose

          curl -sSLO https://raw.githubusercontent.com/hyperledger/fabric/main/scripts/install-fabric.sh
          chmod +x install-fabric.sh
          ./install-fabric.sh --fabric-version 2.2.15 --ca-version 1.5.17 binary docker

          cd fabric-samples/test-network
          ./network.sh down
          ./network.sh up createChannel -ca -c mychannel
          ./network.sh deployCC -ccn hed -ccp "$GITHUB_WORKSPACE/chaincode" -ccl go
      - name: Export Fabric Gateway configuration
        working-directory: /tmp/fabric-samples/test-network
        run: |
          echo "FABRIC_MSP_ID=Org1MSP" >> "$GITHUB_ENV"
          echo "FABRIC_CERT_PATH=$PWD/organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/signcerts" >> "$GITHUB_ENV"
          echo "FABRIC_KEY_PATH=$PWD/organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/keystore" >> "$GITHUB_ENV"
          echo "FABRIC_TLS_CERT_PATH=$PWD/organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt" >> "$GITHUB_ENV"
          echo "FABRIC_PEER_ENDPOINT=dns:///127.0.0.1:7051" >> "$GITHUB_ENV"
          echo "FABRIC_GATEWAY_PEER=peer0.org1.example.com" >> "$GITHUB_ENV"
          echo "FABRIC_CHANNEL=mychannel" >> "$GITHUB_ENV"
          echo "FABRIC_CHAINCODE=hed" >> "$GITHUB_ENV"
          echo "FABRIC_FUNCTION=Commit" >> "$GITHUB_ENV"
      - name: Validate Fabric configuration
        run: go test ./integration/fabric-gateway -run 'Test(ConfigValidation|DefaultLocalConfig|ReadPEM|UninitializedBackendCommitFailsWithoutNetwork|ContextCancellationDoesNotSubmit)$' -count=1
      - name: Run live Fabric tests
        run: go test ./integration/fabric-gateway -count=1 -timeout=10m
        env:
          HED_FABRIC_E2E: "1"
          HED_FABRIC_FAILURE: "1"
      - name: Stop Fabric test network
        if: always()
        working-directory: /tmp/fabric-samples/test-network
        run: ./network.sh down || true
